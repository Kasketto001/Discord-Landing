<header class="bg-[#404EED] text-white">
    <nav class="max-w-7xl mx-auto flex items-center justify-between p-4 px-6">
        <div class="logo">
            <img src="/assets/img/discord-logo.svg" alt="Discord Logo" class="h-8">
        </div>
        <div class="nav-links hidden md:flex gap-8 font-semibold">
            <a href="#" class="hover:underline">Download</a>
            <a href="#" class="hover:underline">Nitro</a>
            <a href="#" class="hover:underline">Discover</a>
            <a href="#" class="hover:underline">Safety</a>
            <a href="#" class="hover:underline">Support</a>
            <a href="#" class="hover:underline">Blog</a>
            <a href="#" class="hover:underline">Careers</a>
        </div>
        <div class="cta">
            <!-- Esempio di Button nel Header: tipo 'default' (bianco) e taglia 'small' -->
            <app-button 
                text="Accedi" 
                type="default" 
                size="small" 
                (infoevent)="onButtonClick($event)">
            </app-button>
        </div>
    </nav>
</header>

@if (message) {
<div class="p-4 text-center">
    <span class="bg-gray-100 p-2 rounded text-sm text-gray-700">Notifica: {{ message }}</span>
</div>
}
