<section id="hero" class=" bg-[#111422] bg-[linear-gradient(180deg,#14192d_0%,#111422_100%)] before:absolute before:inset-0 before:bg-[radial-gradient(circle_at_top_left,rgba(88,101,242,0.15),transparent_60%)] after:absolute after:inset-0 after:bg-[radial-gradient(circle_at_top_right,rgba(114,137,218,0.1),transparent_65%)] flex items-center justify-center">
